name = "arctung-website"
main = "src/worker.ts"
compatibility_date = "2026-09-29"

# Build is self-contained: `npx wrangler deploy` runs this first,
# so the dashboard Build command can stay empty.
[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true